name: HDL build (Vivado)

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Require an empty patch queue (release build)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  bitstream:
    runs-on: [self-hosted, vivado]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Assemble
        run: python3 scripts/assemble_workspace.py --build-root "${VRT49_BUILD_BASE:-/mnt/disk2/scratch}/hopcap-ws-${GITHUB_RUN_ID}" --fetch
      - name: Build bitstream
        run: |
          ws="${VRT49_BUILD_BASE:-/mnt/disk2/scratch}/hopcap-ws-${GITHUB_RUN_ID}"
          flock /tmp/hdl-builder.lock scripts/build_bitstream.sh --ws "$ws" --evidence evidence/bitstream
      - name: Verify evidence
        run: python3 scripts/verify_evidence.py bitstream evidence/bitstream ${{ inputs.release && '--release' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: hopcap-bitstream-${{ github.sha }}
          path: evidence/bitstream
          if-no-files-found: error
