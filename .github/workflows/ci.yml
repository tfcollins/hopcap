name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # tick and vrt49 are private: a PAT with read access to them must be stored as
          # SUBMODULES_TOKEN, or those repos made public; github.token alone cannot clone them.
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e third_party/tick -e ".[test]" "ruff==0.16.1"
      - name: Lint
        run: |
          ruff check src tests scripts examples
          ruff format --check src tests scripts examples
      - name: Build libvrt49.so (golden codec cross-check)
        run: |
          cmake -S third_party/vrt49 -B build/vrt49 -DBUILD_SHARED_LIBS=ON -DVRT49_BUILD_TOOLS=OFF -DVRT49_BUILD_TESTS=OFF
          cmake --build build/vrt49 -j
      - name: Compile the UDP spooler with warnings as errors
        run: cc -O2 -Wall -Wextra -Werror -o /tmp/udp_spool src/hopcap/native/udp_spool.c
      - name: Unit tests
        run: pytest -q
      - name: Hardware suite collects without a board
        run: pytest tests/hardware -q --collect-only
      - name: Shell syntax
        run: bash -n scripts/*.sh

  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # tick and vrt49 are private: a PAT with read access to them must be stored as
          # SUBMODULES_TOKEN, or those repos made public; github.token alone cannot clone them.
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Verilator and cocotb 1.9
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends verilator cmake build-essential
          python -m venv hdl/sim/.venv
          hdl/sim/.venv/bin/pip install "cocotb==1.9.2" pytest
      - name: Build libvrt49.so for the chain test
        run: |
          cmake -S third_party/vrt49 -B build/vrt49 -DBUILD_SHARED_LIBS=ON -DVRT49_BUILD_TOOLS=OFF -DVRT49_BUILD_TESTS=OFF
          cmake --build build/vrt49 -j
      - name: Lint RTL
        run: make -C hdl/sim/cocotb lint
      - name: Controller unit suite
        run: make -C hdl/sim/cocotb TOP=vrt49_fhm_hop_ctrl
      - name: Controller + framer chain
        run: make -C hdl/sim/cocotb TOP=fhm_hop_chain
      - name: No cocotb failures
        # cocotb 1.9's results.xml has no failures= attribute: a failed test is a <failure/> child.
        run: |
          for top in fhm_hop_chain vrt49_fhm_hop_ctrl; do
            f=hdl/sim/cocotb/results_$top.xml
            grep -q '<testcase ' "$f" || { echo "no testcases in $f" >&2; exit 1; }
            if grep -qE '<(failure|error)[ />]' "$f"; then echo "failures in $f" >&2; exit 1; fi
          done

  assemble-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # tick and vrt49 are private: a PAT with read access to them must be stored as
          # SUBMODULES_TOKEN, or those repos made public; github.token alone cannot clone them.
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assemble the pinned workspace (shallow fetch, no Vivado)
        run: python3 scripts/assemble_workspace.py --build-root build/ws --fetch
      - name: Manifest sanity
        run: |
          python3 - <<'PY'
          import json
          m = json.load(open("build/ws/MANIFEST.json"))
          assert m["contract_checks"], "contract checks did not run"
          assert any("vrt49_fhm_hop_ctrl" in f for f in m["files"])
          assert any("tick_adrv9009zu11eg_adrv2crr_fmc.tcl" in f for f in m["files"])
          print(len(m["files"]), "staged files;", "patch queue:", m["patch_queue"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: workspace-manifest
          path: build/ws/MANIFEST.json
