name: Docs

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The docs need no submodule content (tick/vrt49 are private; the regmap table and plots come
      # from files in this repo), so check out without them and install only the docs extras.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[docs]"
      - name: Plots render from the committed run data
        # Smoke run only: SVG bytes differ between matplotlib versions, so the committed SVGs are
        # the published artefacts and this proves docs/data/run7 still renders. Regenerate locally
        # with the same script when the data changes.
        run: python docs/diagrams/make_run_plots.py && git checkout -- docs/_static/run7
      - run: python -m sphinx -W -b html docs docs/_build/html
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: docs/_build/html
  deploy:
    # main pushes deploy automatically; workflow_dispatch lets a branch publish its docs for review
    if: github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && github.event_name == 'push')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
